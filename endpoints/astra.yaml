# Managed CudaGym eval endpoints on Astra (titan-internal); referenced from
# recipes as `hosting: {kind: endpoint, endpoint: astra/<key>}`. Bearer auth
# only (CUDAGYM_AUTH_TOKEN). URLs seeded from solswarm's gpu-skus.toml, which
# currently marks all three disabled — remove `disabled_reason` once restored.

# The key stays `gb10` (the upstream fleet id), but the sku must be the exact
# SupportedHardware enum value: "GB10" is only a name alias of DGX_SPARK.
gb10:
  sku: DGX_SPARK
  url: https://api.cudagym.titan.nvidia.com/dgx-spark
  disabled_reason: pod18 network outage (upstream gpu-skus.toml, 2026-07)

vr100:
  sku: VR100
  url: https://api.cudagym.titan.nvidia.com/vr100
  disabled_reason: pod18 network outage (upstream gpu-skus.toml, 2026-07)

gb300:
  sku: GB300
  url: https://api.cudagym.titan.nvidia.com/gb300
  disabled_reason: pod18 network outage (upstream gpu-skus.toml, 2026-07)
