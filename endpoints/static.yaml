# Hand-run / ad-hoc CudaGym eval endpoints (no provider-implied auth).
#
# Add entries for long-lived servers you start yourself, then reference them
# as `hosting: {kind: endpoint, endpoint: static/<key>}`. Schema:
#
#   <key>:
#     sku: B200                      # cudagym SupportedHardware value
#     url: http://host:8000          # unified server or load-balancer URL
#     disabled_reason: why           # optional; submit errors on disabled entries
#
# Authentication: a server that wants a bearer token reads it from
# CUDAGYM_AUTH_TOKEN. That is the only token name that reaches a running job,
# so an endpoint needing a different one cannot be used here.
#
# (For one-off URLs, `hosting: {kind: endpoint, url: http://...}` inline in the
# recipe works without a registry entry.)
{}
