host: cw-dfw-cs-001
hostname: cw-dfw-cs-001-login-02.cw-dfw-cs-001.hpc.nvidia.com  # -01 is oversubscribed
sku: h100
gpus_per_node: 8

paths:
  # /lustre/fs1 and /lustre/fsw are the same filesystem; both resolve to
  # /lustre/fs1/portfolios/coreai/projects/coreai_nvfm_cupilot/users/alexandery.
  workspace: /lustre/fsw/portfolios/coreai/users/alexandery
  cache: ${paths.workspace}/.cache
  # imported on a dc node: enroot import docker://nvcr.io#0685833318436291/nemorl-atlas:<tag>
  container: ${paths.workspace}/containers/nemorl-atlas.sqsh
  # required only for in-allocation (colocated/disjoint) hosting; import before using those
  # kinds. Build from 3rdparty/solswarm/cudagym docker/<profile>; pre-1.9 images lack
  # cudagym.servers.serve.
  cudagym_container: ${paths.workspace}/containers/cudagym-1.9.sqsh
  models: ${paths.workspace}/models
  output: ${paths.workspace}/experiments/nemorl
  datasets: ${paths.workspace}/datasets/post_training
  artifacts: ${paths.workspace}/cudagym_cache/artifacts
  ccache: ${paths.workspace}/cudagym_cache/ccache

# QoS-scheduled (MARS): --qos is required on every submission.
account: coreai_nvfm_cupilot
partition: batch
qos: normal
# true skips sbatch's --gpus-per-node flag, for clusters whose sbatch rejects it.
skip_gres: false

# cw-dfw-cs-001's login node cannot reach other clusters' login nodes directly, so a
# slurm-service CudaGym deployment bridges them with an SSH tunnel first
# (slurm/deploy_remote_cudagym.py).
requires_proxy_tunnel: true

extra_config_opts: ""
