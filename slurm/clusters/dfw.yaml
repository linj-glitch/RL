host: dfw
hostname: cw-dfw-cs-001-login-01.cw-dfw-cs-001.hpc.nvidia.com
sku: h100
gpus_per_node: 8

paths:
  workspace: /lustre/fs1/portfolios/coreai/users/alexandery
  cache: ${paths.workspace}/.cache
  container: ${paths.workspace}/containers/nemorl-1115.sqsh
  # build from thirdparty/cudagym docker/<profile>; pre-1.9 images lack cudagym.servers.serve
  cudagym_container: ${paths.workspace}/containers/cudagym-1.9.sqsh
  models: ${paths.workspace}/models
  output: ${paths.workspace}/experiments/nemorl
  datasets: ${paths.workspace}/datasets/post_training
  artifacts: ${paths.workspace}/cudagym_cache/artifacts
  ccache: ${paths.workspace}/cudagym_cache/ccache

account: coreai_nvfm_cupilot
partition: batch

# dfw's login node cannot reach other clusters' login nodes directly, so a
# slurm-service CudaGym deployment bridges them with an SSH tunnel first
# (slurm/deploy_remote_cudagym.py).
requires_proxy_tunnel: true

extra_config_opts: ""
