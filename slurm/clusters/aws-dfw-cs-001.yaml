host: aws-dfw-cs-001
hostname: aws-dfw-cs-001-login-02.nvidia.com  # -01 is oversubscribed
sku: gb200
gpus_per_node: 4

paths:
  # Also reachable via the /lustre/fsw/portfolios/nemotron/users/<user> symlink.
  workspace: /lustre/fsw/portfolios/nemotron/projects/nemotron_reason_code/users/alexandery
  cache: ${paths.workspace}/.cache
  # aarch64-only cluster; the nemorl image needs the atlas overlay (docker/Dockerfile.atlas)
  container: ${paths.workspace}/containers/nemorl-atlas-arm64.sqsh
  # build from thirdparty/cudagym docker/<profile>; pre-1.9 images lack cudagym.servers.serve
  cudagym_container: ${paths.workspace}/containers/cudagym-1.9-arm64.sqsh
  models: ${paths.workspace}/models
  output: ${paths.workspace}/experiments/nemorl
  datasets: ${paths.workspace}/datasets/post_training
  artifacts: ${paths.workspace}/cudagym_cache/artifacts
  ccache: ${paths.workspace}/cudagym_cache/ccache

# QoS-scheduled (MARS): --qos is required. batch caps at 4h; batch_long allows 7d.
account: nemotron_reason_code
partition: batch
qos: normal

# 4 GB200s per node (B200 silicon), 192GB per GPU
extra_config_opts: "++policy.dtensor_cfg.tensor_parallel_size=4 ++policy.megatron_cfg.tensor_model_parallel_size=4 ++policy.generation.vllm_cfg.tensor_parallel_size=4 ++policy.train_micro_batch_size=2"
