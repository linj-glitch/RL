# Atlas SFT on Qwen3-8B: Solswarm CUDA-kernel traces in NeMo-RL `openai_format`
# ({messages, tools} rows from the sft-solswarm-traces repo's scripts/traces_to_sft.py;
# single-turn rows load the same way).
#
# Load-bearing constraints:
#   * policy.tokenizer.chat_template pins the atlas preserving template (see the
#     .jinja header for why stock Qwen3 is unsafe). The checkpoint's tokenizer
#     carries it (save_pretrained), so single-turn and agentic RL serving render identically.
#   * data.add_generation_prompt MUST stay false: on agentic data with
#     consecutive tool/user messages, gen-prompt renders are not prefix-stable
#     and get_formatted_message_log silently corrupts token spans. With false,
#     each assistant chunk carries its own header into the loss — intended.
#   * max_total_sequence_length 131072: agentic traces are long, and rows over
#     the limit are masked out (loss_multiplier=0) rather than truncated —
#     check the token-length distribution of any new data drop, and gate any
#     new data/model pairing, with scripts/verify_sft.py (sft-solswarm-traces
#     repo).
#
# Everything not listed below is inherited from examples/configs/sft.yaml,
# including the megatron_cfg block: this recipe trains on DTensor
# (policy.megatron_cfg.enabled is false there), so those values are unused.
#
# Launch: uv run ./examples/run_sft.py --config examples/configs/recipes/atlas/sft_cuda_qwen3-8b.yaml
defaults: "../../sft.yaml"

sft:
  max_num_epochs: 4          # multiple epochs suit a small dataset; re-tune as it grows
  max_num_steps: 1000000

  val_batches: 0             # 0 = validate on ALL val batches. Do not set >0 with
                             # multiple/merged val sets: the val loader is unshuffled
                             # concatenation, so a positive count only sees the head set.
  val_global_batch_size: 8
  val_at_end: true

checkpointing:
  checkpoint_dir: "results/sft_cuda_agentic_qwen3_8b"

policy:
  model_name: "Qwen/Qwen3-8B"   # or a local path; DeepSeek-R1-0528-Qwen3-8B also works
                                # (same Qwen3 tokenizer family) — re-run scripts/
                                # verify_sft.py (sft-solswarm-traces repo) whenever
                                # this changes.
  tokenizer:
    # THE pinned template — shared with the GRPO CUDA recipe and carried into the
    # checkpoint for agentic vLLM serving. See header comment.
    chat_template: "examples/prompts/atlas_preserving_chat_template.jinja"
  train_global_batch_size: 8    # scale up with dataset size
  max_total_sequence_length: 131072

  dtensor_cfg:
    sequence_parallel: true
    activation_checkpointing: true
    tensor_parallel_size: 2
    context_parallel_size: 8    # 131k tokens / CP8 = 16k per rank

  optimizer:
    kwargs:
      lr: 5.0e-5
      eps: 1e-8

data:
  # Replaces the inherited section instead of merging with it: `train` and
  # `validation` are lists here and mappings in examples/configs/sft.yaml, and
  # OmegaConf refuses to merge a list over a mapping.
  _override_: true
  max_input_seq_length: ${policy.max_total_sequence_length}
  add_bos: true                # Qwen3 has no BOS token — harmless warning, kept
                               # true so the recipe stays correct for BOS models.
  add_eos: true
  add_generation_prompt: false # REQUIRED false — see header comment.
  shuffle: true
  num_workers: 1

  # Emit with (sft-solswarm-traces repo):
  #   uv run scripts/extract_traces.py --campaign-id <id> --model claude-opus-4-6 ...
  #   uv run scripts/traces_to_sft.py --in out/traces/<campaign> --out train.jsonl \
  #       --format openai --tool-arg-format object
  # then hold out a validation split (OpenAIFormatDataset has no split option).
  # ALWAYS gate a new data drop + template/model pairing with the same repo's
  # scripts/verify_sft.py.
  train:
    - dataset_name: "openai_format"
      data_path: "/datasets/SET_ME_atlas_sft/train.jsonl"
      use_preserving_dataset: true
      chat_key: "messages"
      tool_key: "tools"
  validation:
    - dataset_name: "openai_format"
      data_path: "/datasets/SET_ME_atlas_sft/val.jsonl"
      use_preserving_dataset: true
      chat_key: "messages"
      tool_key: "tools"
  default:
    prompt_file: null           # system context lives IN the rows; no extra wrapping
    system_prompt_file: null
    processor: "sft_processor"  # REQUIRED: registry default is math_hf_data_processor,
                                # which does not understand {messages, tools} rows.

logger:
  wandb:
    project: "atlas-cuda-sft"
    name: "sft-cuda-agentic-qwen3-8b"   # literal name: data.train here is a list,
                                        # so the ${data.train.dataset_name} interpolation
                                        # from examples/configs/sft.yaml would not resolve.
  swanlab:
    project: "atlas-cuda-sft"
    name: "sft-cuda-agentic-qwen3-8b"
  tensorboard:
    log_dir: "tb_logs-sft-cuda-agentic-qwen3-8b"
  mlflow:
    experiment_name: "atlas-cuda-sft"
    run_name: "sft-cuda-agentic-qwen3-8b"

cluster:
  gpus_per_node: 8
  num_nodes: 2                  # TP2 x CP8 = 16 GPUs for the 131k context
