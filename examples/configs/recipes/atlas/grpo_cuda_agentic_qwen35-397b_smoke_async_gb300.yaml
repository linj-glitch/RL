# Agentic ASYNC GRPO on CudaGym / KernelFactory — Qwen3.5-397B-A17B SMOKE on
# GB300 NVL72 (this cluster's tray: nvidia-smi reports "NVIDIA GB300", 284 GB
# HBM/GPU, 4 GPUs/node — there is no GB200 hardware here, so the async recipe
# targets GB300 and inherits the GB300 smoke's validated grids unchanged).
#
# WHAT CHANGES vs the sync GB300 smoke — only the async training mode:
#   * grpo.async_grpo.enabled: the trajectory collector runs in a background
#     Ray actor and generation overlaps training (async_grpo_train,
#     grpo.py). The collector has first-class NeMo Gym support — it stamps
#     _ng_task_index, streams run_async_nemo_gym_rollout, and retries partial
#     Gym streams — and token_id_capture lives in the NemoGym environment
#     actor BELOW the sync/async split, so the kernelwriter capture path
#     (mask_multi_chain, frozen-capture drops) is identical in both modes.
#   * loss_fn.use_importance_sampling_correction: REQUIRED for async
#     (grpo.py asserts) — trajectories are sampled from weights up to
#     max_trajectory_age_steps old, and the pi_train/pi_gen ratio corrects
#     the mismatch. Uses the engine logprobs the capture path already
#     delivers.
#   * in_flight_weight_updates + max_generation_failures: 3 mirror the
#     in-repo async+Gym precedent (grpo_qwen3_30ba3b_thinking_swe1.yaml).
#     OpenCode kernel-writing rollouts run to 1800 s — without in-flight
#     refit the collector would stall every step on the longest rollout,
#     which is the sync behavior async exists to remove. A late model call
#     that crosses a refit resolves through the frozen-capture drop path on
#     the Gym side (TokenCaptureFrozenError), not a masked batch.
#
# Everything else — trainer grid TP2 x PP6 x DP4 / EP8, one TP16 x PP1 x EP16
# bf16 engine on 4 dedicated nodes (non-colocated, inherited enabled: false),
# eager engines at util 0.60, CudaGym in-allocation disjoint on 1 node — is
# the GB300 smoke's, unchanged. Async needs no resource reshuffle: the
# engine fleet already lives on its own nodes, which is the layout the
# async vLLM path requires.
#
# Submit with --num-nodes 17 (12 train + 4 generation + 1 trailing CudaGym
# node), smoke-scaled, e.g.:
#   --extra-config-opts "logger.wandb_enabled=false grpo.max_num_steps=4
#                        checkpointing.enabled=false"
# (4 steps, not 2: the replay buffer only exercises trajectory aging and
# in-flight refit once there are multiple weight versions in play.
# No grpo.max_num_epochs: async ignores it — the collector consumes the
# train dataloader in ONE pass (sync's epoch loop is what re-iterates it).
# The dataloader is batch_size=num_prompts_per_step with drop_last, so the
# 12-row cuda_smoke set yields exactly one batch and the collector declares
# exhaustion during the step-0 fill (jobs 3338462, 3339230). The data block
# below points at cuda_smoke_async: the same 12 tasks cycled to 48 rows =
# 4 steps x 8 prompts + one 8-prompt lookahead target, with headroom.)
defaults: "grpo_cuda_agentic_qwen35-397b_smoke_gb300.yaml"

checkpointing:
  checkpoint_dir: "results/grpo-cuda-agentic-qwen35-397b-smoke-async-gb300"

policy:
  # Restated (inherited value identical): grpo.sh greps model_name from THIS
  # file to arm the per-node HF page-cache prewarm.
  model_name: "Qwen/Qwen3.5-397B-A17B"
  # Kernel-writing sessions are long; 256k+ context requested. 262144 is the
  # model's native max_position_embeddings (no hf_config_overrides needed) and
  # divides make_sequence_length_divisible_by = TP2 x 2 = 4. Propagates to the
  # engine (vllm_cfg.max_model_len) and the Gym proxy (policy_max_model_len)
  # via the parent chain's interpolations. Engine KV at util 0.60: only the
  # 15 full-attn layers page KV (~31 KB/token/rank with both GQA heads
  # replicated across TP16), so ~120 GB/GPU of KV still fits several full
  # 262k streams concurrently; vLLM preempts beyond that. Trainer side stays
  # protected by the inherited chunked logprob forward + mbs 1.
  max_total_sequence_length: 262144
  megatron_cfg:
    optimizer:
      # On-GPU optimizer, overriding the h100 parent's full CPU offload. The
      # HybridDeviceOptimizer force-syncs FP32 main params + CPU clones of the
      # offloaded shards on the FIRST step: at 397B/DP4 that materialization
      # killed policy.train() on every GB300 grid tried (3401037 host-OOM at
      # offload 0.5/DP2; 3470347 rank drop at offload 1.0/DP4 with 900 GB
      # hosts). At DP4 the distributed optimizer shards are small enough to
      # stay in HBM (~8B params/rank -> ~100 GB opt state across the stage's
      # 284 GB GPUs); v6 (3475723) completed the step this way.
      optimizer_cpu_offload: false
      optimizer_offload_fraction: 0.0
      overlap_cpu_optimizer_d2h_h2d: false
    checkpoint:
      # Synchronous save. The base grpo_math_1B chain enables async_save; its
      # nvidia_resiliency_ext daemon allocates CUDA staging buffers, and with
      # the optimizer now resident in HBM every rank died with "CUDA driver
      # error: out of memory" at the step-1 save (3475723). Same failure class
      # and fix as grpo-dapomath17k-nanov3 ("async checkpoint save runs
      # concurrently" OOM).
      async_save: false

grpo:
  async_grpo:
    enabled: true
    # Strictest freshness for the smoke: a trajectory generated at weights vN
    # trains step vN or vN+1 only. Loosen for throughput on the large job.
    max_trajectory_age_steps: 1
    # Agentic Gym streams can lose a worker transiently (opencode/network);
    # the swe1 async+Gym recipe tolerates 3 before aborting.
    max_generation_failures: 3
    # Update engine weights during generation instead of pausing for the
    # longest in-flight rollout (1800 s agent timeout makes pausing
    # pathological). vLLM requires async_engine: true, inherited from the
    # 27B parent ("required for the NeMo-Gym path").
    in_flight_weight_updates: true
    recompute_kv_cache_after_weight_updates: false

loss_fn:
  # Hard requirement for async GRPO (grpo.py asserts at startup): corrects
  # for trajectories sampled from up-to-max_trajectory_age_steps-old weights.
  # The sync smoke deliberately carries no loss_fn block; this is the one
  # loss-side knob async needs. TIS truncation (swe1 carries type: tis,
  # ratio 5.0) is left at base defaults for the smoke — consider it for the
  # large job if ratios spike.
  use_importance_sampling_correction: true

# ONE env block only (see the smoke_h100 note: a duplicate top-level env: key
# silently replaces the whole mapping).
env:
  nemo_gym:
    cudagym_cuda_agent:
      responses_api_agents:
        cuda_agent:
          # Kernel-writing opencode sessions can run long; 1h per rollout is
          # the most that fits the batch partition's 4h MaxTime alongside 4
          # smoke steps. Async + in-flight refit tolerates the tail: a late
          # model call against an already-frozen capture resolves through the
          # frozen-drop path instead of masking the batch. Raise further for
          # the large job on batch_long.
          timeout: 3600

data:
  train:
    # cuda_smoke's 12 tasks cycled to 48 rows (see header): the async
    # collector's one-pass dataloader needs steps x prompts + one lookahead
    # target of draws, and drop_last eats partial batches.
    data_path: /datasets/cuda_smoke_async/train.jsonl
  validation:
    data_path: /datasets/cuda_smoke_async/val.jsonl

logger:
  log_dir: "logs/grpo-cuda-agentic-qwen35-397b-smoke-async-gb300"
