# Agentic GRPO on CudaGym/SOLBench kernel problems: NeMo-Gym drives the
# OpenCode-based `cuda_agent` (Gym branch: cuda_agent + cudagym resources server
# on the tokenid-core base), which writes/iterates a kernel in a seeded sandbox;
# the cudagym server scores the SUBMITTED kernel with the same staged reward as
# the single-turn env. Token-ids ride the /runs/<token> buffering path (no OpenCode fork).
#
# Launch: `uv run --extra atlas --extra nemo_gym examples/nemo_gym/run_grpo_nemo_gym.py --config <this>`
# (submit_grpo.py picks the runner automatically from env.should_use_nemo_gym).
#
# Before running:
#   * policy.model_name  -> base Qwen3-8B by default; swap in the SFT'd kernel
#                           checkpoint once one exists (its tokenizer embeds the
#                           atlas preserving chat template).
#   * data.*.data_path   -> Gym seed rows built by
#                           nemo_rl.data.atlas_datasets.grpo_cuda_dataset.write_kfb_gym_seeds
#                           (each row: responses_create_params + verifier_metadata + agent_ref).
#   * CUDAGYM_UNIFIED_SERVER_URL / CUDAGYM_AUTH_TOKEN -> B200 eval endpoint
#     (default hosting = remote/Modal; disjoint in-cluster also works — see ray.sub).
#
# HARD CONSTRAINTS (verified against the tokenid-core + nemorl code):
#   * generation temperature/top_p MUST be 1.0: Gym's vllm_model pins run-scoped
#     sampling to on-policy values while nemorl's exposed vLLM server ASSERTS the
#     request matches policy.generation — any other value 500s every model call.
#   * async_engine + expose_http_server must stay true (Gym talks to the policy
#     over HTTP).
#   * Compaction mitigation: opencode's limit.context in cudagym_cuda_agent.yaml
#     (131072) must stay >= max_total_sequence_length so OpenCode never *thinks*
#     it must rewrite history mid-run (which would silently drop post-compaction
#     turns from the training trajectory). Oversized runs then terminate via the
#     vLLM server's context-overflow error instead.
defaults: "../../grpo_math_1B.yaml"

grpo:
  num_prompts_per_step: 8
  num_generations_per_prompt: 4   # agentic rollouts are expensive (many model calls)
  max_rollout_turns: 1            # turns are driven INSIDE Gym/OpenCode, not by this loop
  max_num_steps: 200
  max_num_epochs: 1
  normalize_rewards: true
  use_leave_one_out_baseline: true
  val_period: 20
  val_at_start: false
  max_val_samples: null           # inferred from the val dataset size
  val_batch_size: null
  seed: 42

checkpointing:
  enabled: true
  checkpoint_dir: "results/grpo-cuda-agentic"
  # Agentic-path kernel metrics are unprefixed train-side keys (run_async_nemo_gym_rollout
  # merges aggregate_kernel_metrics into rollout_metrics).
  metric_name: "train:correctness_rate"
  higher_is_better: true
  keep_top_k: 5
  save_period: 20

policy:
  model_name: "Qwen/Qwen3-8B"  # base model for now; swap in the SFT'd kernel checkpoint
  # Base Qwen3-8B's native cap (max_position_embeddings=40960): vLLM refuses a
  # larger max_model_len. Raise (e.g. 131072) only with a rope-scaled/YaRN
  # checkpoint whose config.json actually supports it. See the header for how
  # the compaction mitigation interacts with this value.
  max_total_sequence_length: 40960
  tokenizer:
    name: ${policy.model_name}
    # "default" = the model's own template; an SFT checkpoint from
    # sft_cuda_qwen3-8b.yaml embeds the atlas preserving template, so keep
    # "default" (overriding would make serving diverge from SFT). Base-model
    # caveat: stock Qwen3 templates strip <think> from earlier turns, so
    # multi-turn token capture degrades to the final model call — acceptable
    # for smoke runs; the SFT checkpoint fixes it.
    chat_template: "default"
  train_global_batch_size: 32
  train_micro_batch_size: 1
  precision: "bfloat16"
  dtensor_cfg:
    enabled: true
    tensor_parallel_size: 2
    activation_checkpointing: true
    sequence_parallel: true
    context_parallel_size: 4        # long agentic trajectories at train time
  generation:
    backend: "vllm"
    max_new_tokens: 16384           # per-call cap; matches opencode limit.output
    temperature: 1.0                # HARD constraint — see header
    top_p: 1.0
    top_k: null
    stop_token_ids: null
    stop_strings: null
    vllm_cfg:
      async_engine: true            # required for the NeMo-Gym path
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.7
      max_model_len: ${policy.max_total_sequence_length}
      expose_http_server: true      # Gym's vllm_model proxies to this server
      http_server_serving_chat_kwargs:
        # OpenCode sends OpenAI `tools` and expects parsed tool_calls back;
        # hermes is the <tool_call>{json}</tool_call> parser (Qwen3 conventions,
        # matching the atlas preserving chat template the checkpoint carries).
        enable_auto_tools: true
        tool_parser: hermes

data:
  max_input_seq_length: null        # the trajectory is managed by Gym, not this loop
  shuffle: true
  num_workers: 0
  train:
    # Explicit dataset_name: the math base's data.train (OpenMathInstruct-2 +
    # split_validation_size 0.05) survives the defaults merge, and data.default
    # only fills keys that are MISSING — without these two lines the job would
    # silently train on math rows and carve a 50k validation split.
    dataset_name: NemoGymDataset
    split_validation_size: 0
    data_path: "/datasets/SET_ME_cuda_agentic_seeds/train.jsonl"
  validation:
    data_path: "/datasets/SET_ME_cuda_agentic_seeds/val.jsonl"
  default:
    dataset_name: NemoGymDataset
    env_name: "nemo_gym"
    prompt_file: null
    system_prompt_file: null
    processor: "nemo_gym_data_processor"

env:
  should_use_nemo_gym: true
  should_log_nemo_gym_responses: true
  cudagym:
    # Launcher-only hosting declaration (the NeMo-Gym runner never reads
    # env.cudagym): submit_grpo.py resolves/validates it, preflights the
    # endpoint, and exports CUDAGYM_UNIFIED_SERVER_URL for the Gym cudagym
    # resources server. Agentic recipes must declare exactly ONE entry.
    # In-allocation smoke alternative:
    #   --extra-config-opts "++env.cudagym.b200.hosting.kind=colocated"
    b200:
      sku: "B200"
      hosting:
        kind: endpoint
        endpoint: modal/b200   # endpoints/modal.yaml; needs MODAL_PROXY_TOKEN_ID/SECRET
  nemo_gym:   # passed into NeMo-Gym as the initial_global_config_dict
    port_range_low: 15001
    port_range_high: 20000
    rollout_max_attempts_to_avoid_lp_nan: 1
    is_trajectory_collection: false
    config_paths:
    - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml  # required, *_for_training
    - resources_servers/cudagym/configs/cudagym_cuda_agent.yaml
    - resources_servers/cudagym/configs/cudagym_cuda_agent_training.yaml    # adds model_server -> policy_model (token capture)
    # Optional full SolSwarm parity (optimizer.md prompt + skills + /context + real
    # /submit flow; needs SOLSWARM_SURFACE_ROOT -> 3rdparty/solswarm, exported by grpo.sh):
    # - resources_servers/cudagym/configs/cudagym_cuda_agent_solswarm.yaml
    policy_model:
      responses_api_models:
        vllm_model:
          # The policy emits <think> inline (preserved by the atlas template);
          # no server-side reasoning split.
          uses_reasoning_parser: false

logger:
  log_dir: "logs/grpo-cuda-agentic"
  wandb_enabled: false
  tensorboard_enabled: true
  monitor_gpus: true

cluster:
  gpus_per_node: 8
  num_nodes: 1
