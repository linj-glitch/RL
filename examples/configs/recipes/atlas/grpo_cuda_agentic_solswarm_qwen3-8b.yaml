# Agentic CudaGym GRPO in SolSwarm CONTAINER MODE: same training stack as
# grpo_cuda_agentic_qwen3-8b.yaml, but each rollout runs inside a real
# instance of the published SolSwarm agent image via the host's enroot
# (sandbox_profile=solswarm — the image's entrypoint installs the skills,
# renders the role prompt, and writes the OpenCode config; submit with
# --enroot-agent-image <cluster .sqsh path>) and submits via the real
# /submit flow (submission_mode=solswarm_submit -> every submission is
# canonically evaluated and recorded server-side, scoped to its rollout;
# reward = best submission). See resources_servers/cudagym/configs/
# cudagym_cuda_agent_solswarm.yaml; grpo.sh exports SOLSWARM_SURFACE_ROOT
# (3rdparty/solswarm).
defaults: "grpo_cuda_agentic_qwen3-8b.yaml"

checkpointing:
  checkpoint_dir: "results/grpo-cuda-agentic-solswarm"

env:
  nemo_gym:
    # Full replacement of the base list (OmegaConf merges replace lists):
    # base agent + training overlay + the solswarm-parity overlay LAST so its
    # settings (sandbox_profile, submission_mode, solswarm_surface, ...) win.
    config_paths:
    - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
    - resources_servers/cudagym/configs/cudagym_cuda_agent.yaml
    - resources_servers/cudagym/configs/cudagym_cuda_agent_training.yaml
    - resources_servers/cudagym/configs/cudagym_cuda_agent_solswarm.yaml

logger:
  log_dir: "logs/grpo-cuda-agentic-solswarm"
