# Single-turn (M0) CudaGym GRPO on a Qwen3-32B SFT checkpoint — same data/env/
# reward as the 8B recipe (see grpo_cuda_qwen3-8b.yaml header); only model +
# parallelism differ.
defaults: "grpo_cuda_qwen3-8b.yaml"

checkpointing:
  checkpoint_dir: "results/grpo-cuda-qwen3-32b"

policy:
  model_name: "/models/SET_ME_solswarm_sft_checkpoint_32b"
  dtensor_cfg:
    tensor_parallel_size: 8
  generation:
    vllm_cfg:
      tensor_parallel_size: 4
      gpu_memory_utilization: 0.7

logger:
  log_dir: "logs/grpo-cuda-qwen3-32b"

cluster:
  gpus_per_node: 8
  num_nodes: 2
