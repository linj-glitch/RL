# Single-turn CudaGym GRPO at Qwen3-32B scale — same data/env/reward as the 8B
# recipe (see grpo_cuda_qwen3-8b.yaml header); only model + parallelism differ.
defaults: "grpo_cuda_qwen3-8b.yaml"

checkpointing:
  checkpoint_dir: "results/grpo-cuda-qwen3-32b"

policy:
  model_name: "Qwen/Qwen3-32B"  # base model for now; swap in the SFT'd kernel checkpoint
  dtensor_cfg:
    tensor_parallel_size: 8
  generation:
    vllm_cfg:
      tensor_parallel_size: 4
      gpu_memory_utilization: 0.7

logger:
  log_dir: "logs/grpo-cuda-qwen3-32b"

cluster:
  gpus_per_node: 8
  num_nodes: 2
