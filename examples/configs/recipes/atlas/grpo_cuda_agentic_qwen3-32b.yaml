# Agentic CudaGym GRPO at Qwen3-32B scale — same Gym/agent/constraints as the
# 8B recipe (see grpo_cuda_agentic_qwen3-8b.yaml header: temperature/top_p MUST
# stay 1.0; OpenCode's context limit stays above the model window so it never
# compacts); only model + parallelism differ.
defaults: "grpo_cuda_agentic_qwen3-8b.yaml"

checkpointing:
  checkpoint_dir: "results/grpo-cuda-agentic-qwen3-32b"

policy:
  model_name: "Qwen/Qwen3-32B"  # base-model placeholder; swap in the SFT'd kernel checkpoint
  dtensor_cfg:
    tensor_parallel_size: 8
    context_parallel_size: 4
  generation:
    vllm_cfg:
      tensor_parallel_size: 4   # fit 32B weights + KV cache at the inherited 40960 context
      gpu_memory_utilization: 0.65

logger:
  log_dir: "logs/grpo-cuda-agentic-qwen3-32b"

cluster:
  gpus_per_node: 8
  num_nodes: 4                  # TP8 x CP4 = 32 training GPUs
