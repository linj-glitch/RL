# Agentic CudaGym GRPO in SolSwarm container mode, training on SEVERAL GPU SKUs
# in one job: identical to grpo_cuda_agentic_solswarm_qwen3-8b.yaml except that
# env.cudagym declares one entry per GPU and the dataset mixes rows for both.
# Each entry resolves to its own endpoint; the Gym cudagym resources server
# routes every rollout by the row's own target_hardware.
#
# sol_anchors are measured on a row's own GPU (the row-schema contract), so a
# mixed dataset carries anchors only where someone measured them. Anchorless
# rows score speedup over the reference instead, which exists only when the
# evaluation times that reference — hence benchmark_reference below. The two
# perf terms measure different things; read the per-SKU metrics.
#
# Launch (needs MODAL_PROXY_TOKEN_ID/SECRET for both endpoints):
#   uv run --extra atlas python submit_grpo.py -e agsol_multisku \
#     --config grpo_cuda_agentic_solswarm_multisku_qwen3-8b.yaml \
#     --cluster cw-dfw-cs-001 --num-nodes 1 --time 3:00:00 \
#     --enroot-agent-image $W/containers/solswarm-agent-amd64.sqsh
defaults: "grpo_cuda_agentic_solswarm_qwen3-8b.yaml"

checkpointing:
  checkpoint_dir: "results/grpo-cuda-agentic-solswarm-multisku"

env:
  # One entry per GPU this job trains on. Every entry needs its own endpoint:
  # the entries are what submit-time preflight checks against each endpoint's
  # reported GPU, and what the resources server routes rows by.
  cudagym:
    b200:
      sku: "B200"
      hosting:
        kind: endpoint
        endpoint: modal/b200
    h100:
      sku: "H100"
      hosting:
        kind: endpoint
        endpoint: modal/h100
  nemo_gym:
    # Time the reference implementation, so rows without speed-of-light anchors
    # (everything that is not B200) have a speedup to score. See the header.
    cudagym_benchmark_config:
      benchmark_reference: true

data:
  # Rows alternate between the declared SKUs; every row pins its own
  # target_hardware, which is required once more than one GPU is served.
  train:
    data_path: "/datasets/cuda_agentic_seeds_multisku/train.jsonl"
  validation:
    data_path: "/datasets/cuda_agentic_seeds_multisku/val.jsonl"

logger:
  log_dir: "logs/grpo-cuda-agentic-solswarm-multisku"
