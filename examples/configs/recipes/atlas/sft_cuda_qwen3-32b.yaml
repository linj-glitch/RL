# Atlas SFT on Qwen3-32B — same data/template/constraints as the 8B recipe
# (see sft_cuda_qwen3-8b.yaml header); only model + parallelism differ.
defaults: "sft_cuda_qwen3-8b.yaml"

checkpointing:
  checkpoint_dir: "results/sft_cuda_qwen3_32b"

policy:
  model_name: "Qwen/Qwen3-32B"
  dtensor_cfg:
    tensor_parallel_size: 8
    context_parallel_size: 8   # 131k tokens / CP8 = 16k per rank

logger:
  wandb:
    name: "sft-cuda-qwen3-32b"
  swanlab:
    name: "sft-cuda-qwen3-32b"
  tensorboard:
    log_dir: "tb_logs-sft-cuda-qwen3-32b"
  mlflow:
    run_name: "sft-cuda-qwen3-32b"

cluster:
  gpus_per_node: 8
  num_nodes: 8                 # TP8 x CP8 = 64 GPUs
