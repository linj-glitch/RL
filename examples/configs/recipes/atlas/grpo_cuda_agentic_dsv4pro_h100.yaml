# Agentic GRPO on CudaGym / KernelFactory — DeepSeek-V4-Pro-0813 (1.6T MoE,
# 49B active, MLA + DSA) on 32 train nodes. Lin's target model (2026-08-24).
#
# Trainer layout is upstream's validated DeepSeek-V3 671B template
# (grpo-dapomath17k-dsv3-megatron.yaml: TP8 x PP8 x EP32 x CP4, DeepEP flex,
# 61 layers split 7/6 first/last — V4-Pro is also 61 layers) with the
# 1.6T memory delta carried by optimizer offload: per-GPU fp32 Adam state is
# ~75 GB at 256 GPUs, so the optimizer lives in host RAM (2 TB/node, ~600
# GB/node used) with precision-aware states and overlapped H2D/D2H.
#
# The checkpoint is FP8-native: Megatron-Bridge's deepseek_v4_bridge imports
# and dequantizes to bf16 (Pro variant listed); vLLM serves the FP8 weights
# directly (50 GB/GPU awake at TP32 — same colocated envelope the V3 recipe
# validated at 42 GB/GPU bf16). KNOWN BOSS FIGHT: refit crosses the
# bf16-trainer -> fp8-server precision gap every step; expect the fix loop
# to live there.
#
# Submit with --num-nodes 33 (+1 trailing CudaGym eval node).
defaults: "grpo_cuda_agentic_qwen38-27b_h100.yaml"

# FP8 generation vs bf16 trainer logprobs is a real distribution gap; NeMo-RL
# refuses FP8 rollouts without IS correction (dsv4-4), and the dsv3 recipe
# ships the same pair.
loss_fn:
  use_importance_sampling_correction: true
  use_on_policy_kl_approximation: true

checkpointing:
  checkpoint_dir: "results/grpo-cuda-agentic-dsv4pro"

policy:
  model_name: "deepseek-ai/DeepSeek-V4-Pro-0813"
  tokenizer:
    name: ${policy.model_name}
    # The HF repo ships NO chat_template (only their custom encoding module);
    # this file transcribes encoding_dsv4.py — thinking mode, DSML tool
    # blocks, tool results merged into user turns. Serving and training both
    # render through it.
    chat_template: "examples/configs/recipes/atlas/templates/dsv4_thinking.jinja"
  # Agent prompts are ~10k tokens; 16384 fits prompt + a 4k turn and matches
  # the dsv3 template's window. Divisible by TP8 x 2 x CP4 = 64.
  max_total_sequence_length: 16384
  make_sequence_length_divisible_by: 16
  # dsv3 template runs unpacked (grpo_math_1B default); if MCore asserts
  # packing-for-CP on this path, first fallback is context_parallel_size: 1.
  sequence_packing:
    enabled: false
  megatron_cfg:
    tensor_model_parallel_size: 8
    pipeline_model_parallel_size: 8
    num_layers_in_first_pipeline_stage: 7
    num_layers_in_last_pipeline_stage: 6
    expert_model_parallel_size: 32
    # 24 train nodes = 192 GPUs: TP8 x PP8 = 64-way model, DP3. CP4 needed the
    # full 256-GPU grid; activation ckpt carries the 16k window at CP1.
    context_parallel_size: 1
    moe_enable_deepep: true
    moe_token_dispatcher_type: flex
    optimizer:
      lr: 5.0e-07
      min_lr: 5.0e-08
      # Halves the offloaded state (bf16 moments) and the PCIe traffic.
      use_precision_aware_optimizer: true
      optimizer_cpu_offload: true
      optimizer_offload_fraction: 1.0
      overlap_cpu_optimizer_d2h_h2d: true
    scheduler:
      lr_warmup_init: 5.0e-08
  generation:
    # A17B-class MoE decode is fast; keep the smoke turn cap.
    max_new_tokens: 4096
    temperature: 1.0
    top_p: 1.0
    # NON-colocated: 52 GB/GPU of engine weights cannot share a card with
    # the trainer's shards + load transients (init OOM at util 0.85 and 0.92,
    # dsv4-9/10). Same 33-node budget, recut: 24 train + 8 generation + 1
    # eval; refit via NCCL collectives (the layout validated at 27B).
    colocated:
      enabled: false
      resources:
        gpus_per_node: 8
        num_nodes: 8
    vllm_cfg:
      # TP16, not 32: some V4 grouped-BMM weight has <32 groups, so TP32
      # leaves ranks with ZERO groups — DeepGEMM zero-divides (dsv4-7) and
      # the cutlass c3x fallback rejects the same degenerate shards at
      # dispatch (dsv4-8). At TP16 every rank keeps >=1 group; fp8 weights
      # are 52 GB/GPU, hence the higher memory fraction.
      tensor_parallel_size: 16
      # TP16 x PP2 = 32 GPUs/engine, 26 GB/GPU of weights: at TP16 alone the
      # engine process measured 78.35 GiB at init even on dedicated cards —
      # 52 GB weights + ~20 GB of V4's own runtime pools (DSA indexer
      # buffers, aux-stream private pools; 7.15 GB "private pools" despite
      # eager) (dsv4-11). TP cannot exceed 16 (grouped-BMM zero-groups,
      # dsv4-7/8), so depth-wise is the only way down.
      pipeline_parallel_size: 2
      # 0.5: vLLM's profiler sees only ~6GB of V4's real ~38GB rank footprint
      # (custom pools escape its accounting), so the KV grab is exactly
      # util*79.11 - 6.13GB regardless of what is actually free (61.1GB @0.85,
      # 41.3GB @0.6 — the latter missing the 40.5GB free by 0.8GB, dsv4-14).
      # 0.5 requests ~33GB < 40.5 free; MLA KV at ~35KB/token makes that
      # ~950k tokens — vastly more than the smoke needs.
      gpu_memory_utilization: 0.5
      enforce_eager: true
      # The checkpoint is fp8-native (e4m3, ue8m0 pow2 scales): route through
      # NeMo-RL's init_fp8 path — precision fp8 unlocks the fp8 KV cache that
      # V4's fp8_ds_mla layout requires (dsv4-2) and satisfies the
      # kv-requires-fp8-weights validation (dsv4-3). ue8m0 == pow2 scaling.
      precision: "fp8"
      kv_cache_dtype: "fp8"
      pow2_weight_scaling_factors: true
      pow2_activation_scaling_factors: true
      # V4's fp8_ds_mla cache computes UE8M0 block scales at write time — no
      # trainer-side KV-scale calibration/refit, which is what the async/PP1
      # fp8-KV restrictions guard (dsv4-5). See requires_kv_scale_sync.
      dynamic_kv_block_scales: true
      http_server_serving_chat_kwargs:
        enable_auto_tools: true
        # Matched pair registered as `deepseek_v4` in this vLLM build
        # (deepseekv4_engine_tool_parser / deepseek_v4_engine_reasoning_parser);
        # the proxy-side uses_reasoning_parser below MUST stay in sync
        # (the 27B pairing rule, commit 8a3483eb).
        tool_parser: deepseek_v4
        reasoning_parser: deepseek_v4
    # No moe_backend override: the dsv3 template's `triton` cannot serve
    # V4's MXFP4 experts (SILU unsupported, dsv4-6); the build ships a
    # dedicated deepseek_v4 MXFP4 backend oracle — let it choose.
    vllm_kwargs: {}

env:
  nemo_gym:
    policy_model:
      responses_api_models:
        vllm_model:
          # Reasoning parser is ON serving-side (V4-Pro thinks), so the proxy
          # must re-wrap reasoning into content.
          uses_reasoning_parser: true
          # temp/top_p only — presence_penalty was a Qwen3.8 think-loop
          # countermeasure and penalizes repeated identifiers in code.
          sampling_overrides:
            temperature: ${policy.generation.temperature}
            top_p: ${policy.generation.top_p}

logger:
  log_dir: "logs/grpo-cuda-agentic-dsv4pro"

cluster:
  gpus_per_node: 8
  num_nodes: 32
