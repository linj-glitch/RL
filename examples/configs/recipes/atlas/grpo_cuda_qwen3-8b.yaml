# Single-turn GRPO on CudaGym / SOLBench (Kernel-Factory-Bench) kernel
# problems, evaluated on B200. Launch: `uv run examples/run_grpo_cuda.py --config <this>`.
#
# Inherits all unspecified fields (loss_fn, full policy/data defaults, ...) from
# grpo_math_1B.yaml and overrides only the CudaGym-specific bits. Before running:
#   * policy.model_name      -> base Qwen3-8B by default; swap in the SFT'd
#                               kernel checkpoint once one exists
#   * data.dataset_path      -> a SOLBench problem JSONL (build from a KFB checkout
#                               with nemo_rl.data.atlas_datasets.write_kfb_dataset)
#   * env.cudagym.b200.hosting -> where the B200 CudaGym eval servers live
#     (submit_grpo.py validates + preflights it; see slurm/cudagym_hosting.py
#     and endpoints/*.yaml).
defaults: "../../grpo_math_1B.yaml"

grpo:
  num_prompts_per_step: 8
  num_generations_per_prompt: 8  # effective batch = 8 * 8 = 64 completions / step
  max_rollout_turns: 1  # SINGLE-TURN: prompt -> one kernel completion -> reward -> done
  max_num_steps: 200
  max_num_epochs: 1
  normalize_rewards: true
  use_leave_one_out_baseline: true
  val_period: 20
  val_at_start: false
  max_val_samples: 8
  val_batch_size: 8
  seed: 42

checkpointing:
  enabled: true
  checkpoint_dir: "results/grpo-cuda-b200"
  # TRAIN-side metric: the cudagym env metrics land in the per-step train metrics
  # as {task_name}/{metric} (rollouts._aggregate_env_metrics). The native validate()
  # path reports only accuracy/avg_length, so a "val:correctness_rate" here would
  # raise "Metric not found" at the first save step.
  metric_name: "train:b200/correctness_rate"
  higher_is_better: true
  keep_top_k: 5
  save_period: 20

policy:
  model_name: "Qwen/Qwen3-8B"  # base model for now; swap in the SFT'd kernel checkpoint
  max_total_sequence_length: 16384  # generous for <think> + a kernel; raise for big problems
  tokenizer:
    name: ${policy.model_name}
    # THE shared atlas template (think+tools-preserving, prefix-stable) — the SAME
    # file the SFT recipe (sft_cuda_qwen3-8b.yaml) pins, so the RL rollout
    # surface renders byte-identically to the SFT training surface. The SFT
    # checkpoint's tokenizer also embeds it, which is what the agentic path's NeMo-Gym vLLM
    # server picks up. The single-turn recipe exercises the no-tools path of the template.
    chat_template: "examples/prompts/atlas_preserving_chat_template.jinja"
  train_global_batch_size: 32
  train_micro_batch_size: 1
  precision: "bfloat16"
  dtensor_cfg:
    enabled: true
    tensor_parallel_size: 1  # raise for larger SFT checkpoints
    activation_checkpointing: true
  generation:
    backend: "vllm"
    max_new_tokens: ${policy.max_total_sequence_length}
    temperature: 1.0
    top_p: 1.0
    top_k: null
    stop_token_ids: null
    stop_strings: null
    vllm_cfg:
      async_engine: false
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.6
      max_model_len: ${policy.max_total_sequence_length}

data:
  max_input_seq_length: ${policy.max_total_sequence_length}
  prompt_file: "examples/prompts/cudagym.txt"
  system_prompt_file: null
  # Built from a KFB checkout with write_kfb_dataset (grpo_cuda_dataset.py; its
  # docstring has the sol_latency_ms caveat). Preferred set: data/sol_execbench_external
  # (real SOL anchors; eval server profile sol_execbench_external, language=triton, DPS=false).
  # The JSONL must hold >= grpo.num_prompts_per_step train rows after the
  # test_size split (the train dataloader drops the last partial batch); raise
  # grpo.max_num_epochs to run more steps than one pass over the data provides.
  dataset_path: "/datasets/solbench_sol_execbench_b200.jsonl"
  test_size: 0.1
  shuffle: false

env:
  cudagym:
    # One entry per GPU SKU; the entry name is the task_name and (by default)
    # the sku. Add more entries (with weights) to mix SKUs. Every entry must
    # declare `hosting:` — where its eval servers live (submit_grpo.py
    # validates it, preflights remote endpoints, and wires the URLs through;
    # kinds: colocated | disjoint {num_nodes: N} | endpoint |
    # slurm-service {service_cluster, num_service_nodes, endpoint_port,
    # [service_login_port: 8998]} — experimental: submit stands the service up
    # on that OTHER cluster and chains login-node proxies, see
    # slurm/deploy_remote_cudagym.py).
    b200:
      sku: "B200"
      weight: 1.0
      hosting:
        kind: endpoint
        # Registry ref (endpoints/<provider>.yaml); modal needs
        # MODAL_PROXY_TOKEN_ID/SECRET in the submitting shell. In-cluster
        # smoke alternative (on a B200-silicon cluster):
        #   --extra-config-opts "++env.cudagym.b200.hosting.kind=colocated"
        endpoint: modal/b200
      compilation_timeout: 300
      execution_timeout_per_trial: 120
      # Correctness-gated: an incorrect kernel earns 0 (format/compile/execute
      # progress is metrics-only — a bare stub "compiles" for JIT languages);
      # a correct one earns correctness + performance * SOL-score (in [0,1],
      # from the row's baked anchors). Range [0, 2].
      reward_weights:
        correctness: 1.0
        performance: 1.0
      perf_reward_config:
        clip_max: 10.0
        clip_min: 0.1
        speedup_ratio: 0.75
        # Anchor-less rows only: let a correct kernel earn the perf term from
        # log-normalized speedup-over-reference (needs a timed reference);
        # false -> correct-but-anchorless earns the correctness weight alone.
        # NOTE: this fallback needs a TIMED reference, i.e. benchmark_config
        # benchmark_reference: true. With the default (false) cudagym reports no
        # speedup_factor, so an anchor-less row earns the correctness weight and
        # NO performance gradient regardless of this setting.
        allow_speedup_fallback: true
      # CudaGym EvalConfig overrides. lock_clocks=true so eval timing matches the
      # locked-clock SOL/human-best anchors baked into each dataset row (the
      # perf reward needs those anchors — rows without them report
      # reference_latency_ms=0 and the perf term is unearnable unless you also
      # set benchmark_reference: true here, at extra eval cost).
      benchmark_config: {lock_clocks: true}
      # Fail fast at env init if the endpoint's /health reports a different GPU
      # than `sku` (otherwise silent for Triton kernels).
      verify_endpoint_sku: true
      # null -> resolved from CUDAGYM_UNIFIED_SERVER_URL / CUDAGYM_URL (+ CUDAGYM_AUTH_TOKEN).
      # Set explicitly for a fixed remote/colocated endpoint.
      server_url: null

logger:
  log_dir: "logs/grpo-cuda-b200"
  wandb_enabled: false
  tensorboard_enabled: true
  monitor_gpus: true
  # Per-step prompt/completion tables (W&B sink; grpo.sh forces wandb on at
  # submit time even though the local default above is false).
  log_conversations: true

cluster:
  gpus_per_node: 1
  num_nodes: 1
